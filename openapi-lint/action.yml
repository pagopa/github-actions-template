name: OpenAPI lint
description: "Lint an OpenAPI spec with Spectral and fail the job when findings exceed the given thresholds"

inputs:
  spec_path:
    required: true
    type: string
    description: Path to the OpenAPI spec to lint, relative to the repository root
  ruleset:
    required: false
    type: string
    default: ''
    description: Path to a Spectral ruleset in the calling repository. Empty means the ruleset bundled with this action
  max_errors:
    required: false
    type: number
    default: 0
    description: Maximum number of error findings tolerated before the job fails
  max_warnings:
    required: false
    type: number
    default: 0
    description: Maximum number of warning findings tolerated before the job fails
  fail_on_violation:
    required: false
    type: boolean
    default: true
    description: >
      Fail the job when a threshold is exceeded. Set to false to run in report-only mode.
      A lint that cannot run at all fails the job regardless, since it is a configuration
      error rather than a finding.
  spectral_version:
    required: false
    type: string
    default: "6.16.3"
    description: Version of @stoplight/spectral-cli to install
  owasp_ruleset_version:
    required: false
    type: string
    default: "2.0.1"
    description: Version of @stoplight/spectral-owasp-ruleset to install

runs:
  using: "composite"
  steps:
    - name: Install Spectral and the OWASP ruleset
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RULESET: ${{ inputs.ruleset }}
        SPECTRAL_VERSION: ${{ inputs.spectral_version }}
        OWASP_RULESET_VERSION: ${{ inputs.owasp_ruleset_version }}
      run: |
        # An empty ruleset input means the calling repository takes the bundled one.
        RULESET="${INPUT_RULESET:-${ACTION_PATH}/default.spectral.yaml}"

        # Spectral resolves the npm packages a ruleset extends starting from the
        # directory of the ruleset file, so the install targets that directory. It
        # creates only a node_modules directory, no package.json and no lock file.
        npm install --no-save --no-package-lock --prefix "$(dirname "$RULESET")" \
          "@stoplight/spectral-cli@${SPECTRAL_VERSION}" \
          "@stoplight/spectral-owasp-ruleset@${OWASP_RULESET_VERSION}"

    - name: Lint ${{ inputs.spec_path }}
      shell: bash
      env:
        # Every value reaches the script as an environment variable and none is
        # interpolated into the script itself, so nothing can be spliced into the shell.
        ACTION_PATH: ${{ github.action_path }}
        SPEC_PATH: ${{ inputs.spec_path }}
        RULESET: ${{ inputs.ruleset }}
        MAX_ERRORS: ${{ inputs.max_errors }}
        MAX_WARNINGS: ${{ inputs.max_warnings }}
        FAIL_ON_VIOLATION: ${{ inputs.fail_on_violation }}
      run: bash "${ACTION_PATH}/openapi-lint.sh"
