name: Payments flow docker snapshot
description: Payments flow docker snapshot

inputs:
  current_branch:
    description: Branch used to launch the action
    required: true
  github_pat:
    description: Personal GitHub token for packages
    required: false
    default: ''
  docker_labels:
    description: Labels for docker push
    required: false
    default: |
      maintainer=https://pagopa.it
      org.opencontainers.image.source=https://github.com/${{ github.repository }}
  extra_build_args:
    description: Additional Docker build args (one per line, e.g. FOO=bar)
    required: false
    default: ''
  platforms:
    description: Platforms for Docker build (comma-separated, e.g. linux/amd64,linux/arm64)
    required: false
    default: 'linux/amd64'


runs:
  using: "composite"
  steps:
      # Set the appropriate token
      - name: 🔐 Set GitHub Token
        id: set_token
        shell: bash
        run: |
          if [ -n "${{ inputs.github_pat }}" ]; then
            echo "ℹ️ Using personal GitHub PAT token"
            echo "GIT_AUTH_TOKEN=${{ inputs.github_pat }}" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ Using default GitHub token"
            echo "GIT_AUTH_TOKEN=${{ github.token }}" >> $GITHUB_OUTPUT
          fi

      - name: 🤔 Set Docker tags
        id: set_docker_tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DOCKER_TAGS=ghcr.io/${{ github.repository }}:develop-latest,ghcr.io/${{ github.repository }}:snapshot,ghcr.io/${{ github.repository }}:snapshot-${{ inputs.current_branch }}" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAGS=ghcr.io/${{ github.repository }}:snapshot,ghcr.io/${{ github.repository }}:snapshot-${{ inputs.current_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: 🛃 Log in to the Github Container registry
        id: docker_login
        # https://github.com/docker/login-action/releases/tag/v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.set_token.outputs.GIT_AUTH_TOKEN }}

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.set_docker_tags.outputs.DOCKER_TAGS }}
          labels: ${{ inputs.docker_labels }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            GIT_AUTH_TOKEN=${{ steps.set_token.outputs.GIT_AUTH_TOKEN }}
            ${{ inputs.extra_build_args }}
          secrets: GIT_AUTH_TOKEN=${{ steps.set_token.outputs.GIT_AUTH_TOKEN }}
