name: 'Docker Golden Image: Build and Promote to MA'
description: 'Builds and pushes a Docker image with MA tags and exposes digest & tag information.'

inputs:
  dockerfile_path:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  docker_context:
    description: 'Docker build context path'
    required: false
    default: '.'
  registry:
    description: 'Container registry URL'
    required: false
    default: 'ghcr.io'
  image_name:
    description: 'Image name (defaults to repository name)'
    required: false
    default: ''
  build_args:
    description: 'Docker build arguments (comma-separated KEY=VALUE pairs)'
    required: false
    default: ''
  platforms:
    description: 'Target platforms for build'
    required: false
    default: 'linux/amd64'
  registry_username:
    description: 'Registry username'
    required: false
  registry_password:
    description: 'Registry password'
    required: true

outputs:
  image-digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  image-tag:
    description: 'Image tag'
    value: ${{ steps.meta.outputs.version }}
  full-image:
    description: 'Full image reference'
    value: ${{ steps.output.outputs.full-image }}
  version:
    description: 'Release version'
    value: ${{ steps.version.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image name
      id: image
      shell: bash
      run: |
        if [ -z "${{ inputs.image_name }}" ]; then
          echo "name=${{ github.repository }}" >> $GITHUB_OUTPUT
        else
          echo "name=${{ inputs.image_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username || github.actor }}
        password: ${{ inputs.registry_password }}

    - name: Parse build args
      id: build-args
      shell: bash
      run: |
        if [ -n "${{ inputs.build_args }}" ]; then
          echo "args<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.build_args }}" | tr ',' '\n' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "args=" >> $GITHUB_OUTPUT
        fi

    - name: Generate version
      id: semantic-release-config
      shell: bash
      run: |
        cat > .releaserc.json <<EOF
        {
          "plugins": [
            "@semantic-release/commit-analyzer",
            "@semantic-release/release-notes-generator",
            "@semantic-release/github"
          ]
        }
        EOF

    - name: Generate version
      id: semantic-release
      uses: cycjimmy/semantic-release-action@v4
      with:
        dry_run: true
        extra_plugins: |
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/github
      env:
        GITHUB_TOKEN: ${{ inputs.registry_password }}

    - name: Cleanup semantic-release config
      shell: bash
      run: rm .releaserc.json

    - name: Set version output
      id: version
      shell: bash
      run: |
        NEXT_VERSION="${{ steps.semantic-release.outputs.new_release_version }}"
        RELEASE_NOTES=$(echo '${{ steps.semantic-release.outputs.new_release_notes }}' | jq -R -s .)
        
        if [ -z "$NEXT_VERSION" ]; then
          echo "No release version detected by semantic-release, falling back to timestamp"
          VERSION=$(date +%Y.%m.%d-%H%M%S)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "notes=No automated release notes available." >> $GITHUB_OUTPUT
        else
          echo "version=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.semantic-release.outputs.new_release_notes }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.image.outputs.name }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=ma-{{date 'YYYYMMDD-HHmmss'}}

    - name: Build and push MA image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.docker_context }}
        file: ${{ inputs.dockerfile_path }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ steps.build-args.outputs.args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set outputs
      id: output
      shell: bash
      run: |
        echo "full-image=${{ inputs.registry }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

    - name: Create main image manifest
      shell: bash
      run: |
        cat > main-image-manifest.json <<EOF
        {
          "environment": "ma",
          "repository": "${{ github.repository }}",
          "image": "${{ inputs.registry }}/${{ steps.image.outputs.name }}",
          "digest": "${{ steps.build.outputs.digest }}",
          "version": "${{ steps.version.outputs.version }}",
          "tags": $(echo '${{ steps.meta.outputs.tags }}' | jq -R -s -c 'split("\n") | map(select(length > 0))'),
          "commit_sha": "${{ github.sha }}",
          "commit_message": $(echo '${{ github.event.head_commit.message }}' | jq -R -s .),
          "built_at": "${{ github.event.head_commit.timestamp }}",
          "built_by": "${{ github.actor }}",
          "workflow_run_id": "${{ github.run_id }}",
          "workflow_run_number": "${{ github.run_number }}"
        }
        EOF
        cat main-image-manifest.json

    - name: Create GitHub Release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const version = '${{ steps.version.outputs.version }}';
          const notes = `${{ steps.version.outputs.notes }}`;
          const manifest = JSON.parse(fs.readFileSync('main-image-manifest.json', 'utf8'));
          
          try {
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              body: `## Main Deployment\n\n` +
                    `### Changelog\n` +
                    `${notes}\n\n` +
                    `--- \n\n` +
                    `**Repository:** ${{ github.repository }}\n` +
                    `**Image Digest:** \`${manifest.digest}\`\n` +
                    `**Commit:** ${{ github.sha }}\n` +
                    `**Built by:** ${{ github.actor }}\n` +
                    `**Built at:** ${manifest.built_at}\n\n` +
                    `### Available Tags:\n` +
                    manifest.tags.map(tag => `- \`${tag}\``).join('\n'),
              draft: false,
              prerelease: false
            });
          } catch (error) {
            console.log('Release creation failed (tag may already exist):', error.message);
          }

    - name: Upload manifest as artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-builded-manifest.zip
        path: main-image-manifest.json
        retention-days: 90

    - name: Summary
      shell: bash
      run: |
        echo "### ✅ MA Image Built and Promoted" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** MA (Main/Staging)" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | while read tag; do
          [ -n "$tag" ] && echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
        done
